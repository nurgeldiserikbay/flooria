name: flooria
description: A gentle infinite puzzle tower.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/tower/
    - assets/2048.svg
    - assets/number_trail.svg
    - assets/color_match.svg
    - assets/games.svg
    - assets/my_mind.svg
    - assets/play.svg
    - assets/locked.svg
    - assets/completed.svg
    - assets/sprout.svg
    - assets/Glossy FLOORIA Game Logo with Sprout (2).png
