name: Build reusable Flooria art
on:
  push:
    branches: [main]
    paths:
      - tools/build_soft_assets.py
      - tools/build_reference_tower.py
      - .github/workflows/build-soft-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Render reusable transparent floor and game sprites
        run: python tools/build_soft_assets.py
      - name: Render reference-matched reusable 2.5D tower floors
        run: python tools/build_reference_tower.py
      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/soft_floor_*.webp assets/art/soft_icon_*.webp assets/art/soft_sky.webp assets/art/ref_floor_*.webp
          if ! git diff --cached --quiet; then
            git commit -m "feat(art): add generated soft 2.5D floor and game sprites"
            git push origin HEAD:main
          fi
