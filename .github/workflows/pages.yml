name: Deploy Flooria Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Keep packaging separate so a failed Pages deployment can be retried
  # without uploading a second artifact named "github-pages" to the same run.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform scaffolding
        run: flutter create --project-name flooria --platforms=web,android,ios .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run automated tests
        run: flutter test --reporter expanded
      - name: Build web
        run: flutter build web --release --base-href /flooria/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # deploy-pages@v4 has a hard maximum of 600000ms (10 minutes);
      # higher timeout values are silently clamped and do not fix a
      # server-side "syncing_files" hang. Keep build and deploy separate so
      # only this job can be retried without duplicate Pages artifacts.
      - name: Explain failed Pages deployment
        if: ${{ failure() }}
        run: |
          echo "::warning::GitHub Pages publication failed after a successful build. Check the Deploy to GitHub Pages log for syncing_files timeout or service errors."
          echo "::warning::Retry only the failed deploy job, not the entire run. If syncing_files persists, check https://www.githubstatus.com/ and contact GitHub Support."
